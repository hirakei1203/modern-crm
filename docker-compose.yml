services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_app
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - crm_network

  nginx:
    image: nginx:stable-alpine
    container_name: crm_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crm_network

  mysql:
    image: mysql:8.0
    container_name: crm_mysql
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules:
